<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dice Roller</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Outfit:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="bg-blob bg-blob-a" aria-hidden="true"></div>
    <div class="bg-blob bg-blob-b" aria-hidden="true"></div>

    <main class="page">
      <nav class="page-nav" aria-label="Page">
        <a class="nav-link" href="/help">Help</a>
      </nav>

      <header class="hero">
        <div class="hero-badge" aria-hidden="true">🎲</div>
        <h1>Dice Roller</h1>
        <p class="tagline">Roll tabletop-style dice with count, sides, and optional modifiers</p>
      </header>

      <section class="card">
        <label class="field" for="notation-input">
          <span class="field-label">Dice notation</span>
          <input
            id="notation-input"
            type="text"
            placeholder="e.g. 3d6+2"
            autocomplete="off"
            spellcheck="false"
          />
        </label>

        <div class="examples">
          <span class="examples-label">Examples:</span>
          <div class="example-chips">
            {% for ex in examples %}
            <button type="button" class="chip" data-notation="{{ ex }}">{{ ex }}</button>
            {% endfor %}
          </div>
        </div>

        <button type="button" id="btn-roll" class="btn btn-primary">Roll</button>
        <p id="error-text" class="error" role="alert" hidden></p>
      </section>

      <section class="card result-card" id="result-card" hidden aria-live="polite">
        <p class="result-label">Total</p>
        <p class="result-total" id="result-total">0</p>
        <p class="result-meta" id="result-meta"></p>
        <div class="die-row" id="die-row"></div>
      </section>
    </main>

    <script src="/static/session-persist.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
